upstream evo_nodes {
    # Round robin is nginx's default. The zone shares its position between the
    # worker processes; without it each worker rotates on its own and requests
    # in a row may land on the same node.
    zone evo_nodes 64k;
    server php1:80;
    server php2:80;
}

server {
    listen 80;

    # The file manager uploads go through here.
    client_max_body_size 64m;

    location / {
        proxy_pass http://evo_nodes;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Which node answered, for the smoke test.
        add_header X-Evo-Upstream $upstream_addr always;
    }
}
