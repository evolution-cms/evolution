name: CI

on:
  push:
    branches:
      - '3.*.x'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_EXTENSIONS: ctype, dom, fileinfo, filter, iconv, intl, json, mbstring, openssl, pdo, pdo_sqlite, readline, simplexml, tokenizer, xml, xmlreader, zip

jobs:
  analyze:
    name: Static analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-analyze-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-analyze-

      # Only the root dependencies (PHPStan) are installed here:
      # core/vendor is committed and provides everything phpstan.neon bootstraps.
      - name: Install root dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: composer analyze

  tests:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-core-${{ hashFiles('core/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-core-

      - name: Install core dependencies
        working-directory: core
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Pest
        working-directory: core
        run: composer test -- --compact

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # The audit reads composer.lock and the advisory database; it does not run the code,
          # so one version is enough. Kept at the lowest supported one for consistency.
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      # --locked audits the lock file directly: no vendor tree has to be installed, and what is
      # audited is exactly what a site gets. core/ is where the shipped dependencies live.
      - name: Audit shipped dependencies
        working-directory: core
        run: composer audit --locked --no-dev

      # Dev-only tooling (Pest and friends) never reaches a live site, so an advisory there is
      # worth seeing but must not block a release. The root composer.json holds PHPStan alone and
      # ships no lock file, so there is nothing to audit there.
      - name: Audit development dependencies
        continue-on-error: true
        working-directory: core
        run: composer audit --locked
