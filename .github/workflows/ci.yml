name: CI

on:
  push:
    branches:
      - '3.*.x'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_EXTENSIONS: ctype, dom, fileinfo, filter, iconv, intl, json, mbstring, openssl, pdo, pdo_sqlite, readline, simplexml, tokenizer, xml, xmlreader, zip

jobs:
  analyze:
    name: Static analysis (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-analyze-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-analyze-

      # Only the root dependencies (PHPStan) are installed here:
      # core/vendor is committed and provides everything phpstan.neon bootstraps.
      - name: Install root dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: composer analyze

  tests:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-core-${{ hashFiles('core/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-core-

      - name: Install core dependencies
        working-directory: core
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Pest
        working-directory: core
        run: composer test -- --compact

  install:
    name: Install on ${{ matrix.db }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two database servers the CLI installer supports besides sqlite,
        # each on its current long term release. The sqlite path is covered by
        # the build workflow, which installs on it to produce the nightly zip.
        db: [mysql, pgsql]
        php: ['8.3', '8.4']
    env:
      COMPOSE: .github/docker/ci/docker-compose.yml
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7

      # Everything happens inside the containers: a PHP image with pdo_mysql and
      # pdo_pgsql, next to the database server. See .github/docker/ci/ for what
      # the run asserts - it fails on any PHP diagnostic, on missing or wrong
      # seeded data, and on a site that does not answer.
      - name: Install and smoke test
        run: |
          docker compose -f "$COMPOSE" --profile ${{ matrix.db }} up \
            --build \
            --abort-on-container-exit \
            --exit-code-from install-${{ matrix.db }}

      - name: Database server log
        if: failure()
        run: docker compose -f "$COMPOSE" --profile ${{ matrix.db }} logs ${{ matrix.db }}

      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE" --profile ${{ matrix.db }} down -v
